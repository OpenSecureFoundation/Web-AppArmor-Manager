<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Authentification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#4f46e5,#7c3aed); }
        .auth-container { background: #fff; width: 100%; max-width: 380px; padding: 2.5rem; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .auth-container h1 { text-align: center; margin-bottom: 0.5rem; color: #111827; }
        .auth-container p { text-align: center; color: #6b7280; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.9rem; color: #374151; margin-bottom: 0.3rem; }
        input { width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid #d1d5db; outline: none; transition: border 0.3s; }
        input:focus { border-color: #6366f1; }
        .btn { width: 100%; padding: 0.8rem; border: none; border-radius: 10px; background: #6366f1; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; margin-top: 0.5rem; }
        .btn:hover { background: #4f46e5; }
        .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; }
        .auth-footer a { color: #6366f1; text-decoration: none; font-weight: 500; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-container">
    <h1>Bienvenue </h1>
    <p>Connecte-toi à ton espace sécurisé</p>

    <!-- FORMULAIRE AVEC ID -->
   <form method="POST" action="/">
        <div class="form-group">
            <label>Noms</label>
            <input
type="text"
id="Noms"
name="username"
placeholder="Nom d'utilisateur"
required> 
        </div>

        <div class="form-group">
            <label>Mot de passe</label>
            <input
type="password"
id="password"
name="password"
placeholder="••••••••"
required>
        </div>

        <button type="submit" class="btn">Se connecter</button>
    </form>

    <div class="auth-footer">
        <p><a href="#">Mot de passe oublié ?</a></p>
        <p>Pas encore de compte ? <a href="#">Créer un compte</a></p>
    </div>
</div>

<!-- SCRIPT POUR REDIRECTION VERS ACCUEIL -->


</body>
</html>
